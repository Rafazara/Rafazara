<path d="M400 25V193M800 25V193" stroke="#796b5e" stroke-opacity=".45"/>
<g font-family="Arial,Helvetica,sans-serif">
<text x="31" y="50" font-size="12" letter-spacing="2.6" fill="#d38b58" font-weight="700">01 / DIGITAL</text>
<text x="31" y="102" font-size="27" letter-spacing="-.4" font-weight="700" fill="#f0eae2">Interfaces &amp;</text><text x="31" y="135" font-size="27" letter-spacing="-.4" font-weight="700" fill="#f0eae2">products</text>
<text x="31" y="175" font-size="15" fill="#ada69f">Useful experiences, intentionally made.</text>
<text x="430" y="50" font-size="12" letter-spacing="2.6" fill="#d38b58" font-weight="700">02 / PHYSICAL</text>
<text x="430" y="102" font-size="27" letter-spacing="-.4" font-weight="700" fill="#f0eae2">Objects &amp;</text><text x="430" y="135" font-size="27" letter-spacing="-.4" font-weight="700" fill="#f0eae2">electronics</text>
<text x="430" y="175" font-size="15" fill="#ada69f">Prototypes you can hold and use.</text>
<text x="830" y="50" font-size="12" letter-spacing="2.6" fill="#d38b58" font-weight="700">03 / EXPERIMENTAL</text>
<text x="830" y="102" font-size="27" letter-spacing="-.4" font-weight="700" fill="#f0eae2">Ideas in</text><text x="830" y="135" font-size="27" letter-spacing="-.4" font-weight="700" fill="#f0eae2">between</text>
<text x="830" y="175" font-size="15" fill="#ada69f">Creative tools, AI and retro tech.</text>
