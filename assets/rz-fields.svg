<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-labelledby="t d">
<title id="t">Areas of exploration</title><desc id="d">Three fields of exploration: digital experiences, physical computing, creative technology.</desc>
<defs><linearGradient id="b" x2="1" y2=".7"><stop stop-color="#12171c"/><stop offset="1" stop-color="#0d1115"/></linearGradient><pattern id="p" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#d69e74" opacity=".11"/></pattern></defs>
<rect x="1" y="1" width="1198" height="218" rx="11" fill="url(#b)" stroke="#55483e" stroke-opacity=".7"/>
